name: Build Mobile Frontend

on:
  push:
    branches:
      - "**"
    paths: ##only triggered on the change of front-end files
      - "frontend/ailixir/**"
      - ".github/workflows/buildmobile_frontend.yaml"
      # - main
  workflow_dispatch:
  # release:
  #   types:
  #     - published

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # directory where the React Native project lives
  PROJECT_DIR: frontend/ailixir

  NODE_VERSION: "lts/krypton"
  JAVA_VERSION: "17"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci

      - name: Run Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run lint

  build:
    name: Install and build
    needs: lint
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci

      - name: Build on EAS
        working-directory: ${{ env.PROJECT_DIR }}
        run: eas build --platform android --non-interactive --no-wait
