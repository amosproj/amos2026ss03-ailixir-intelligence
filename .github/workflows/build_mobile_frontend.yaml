name: Manual Mobile Frontend Build

on:
  workflow_dispatch:
  # release:
  #   types:
  #     - published

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # directory where the React Native project lives
  PROJECT_DIR: frontend/ailixir

  NODE_VERSION: "lts/krypton"
  JAVA_VERSION: "17"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci

      - name: Run Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run lint

  build:
    name: Install and build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci

      - name: Build Android App via EAS
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx eas-cli build --profile preview --platform android --non-interactive --local

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-apk
          path: |
            *.apk
            app-release.apk
            android/app/build/outputs/apk/**/*.apk
            ${{ env.PROJECT_DIR }}/*.apk
            ${{ env.PROJECT_DIR }}/app-release.apk
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
