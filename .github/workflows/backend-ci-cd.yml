name: API CI/CD

on:
  push:
    branches: [main, "feature/**", "chore/issue-47-CI/CD-for-Backend"]
    paths: ["Backend/api/**", ".github/workflows/backend-ci-cd.yml"]
  pull_request:
    paths: ["Backend/api/**", ".github/workflows/backend-ci-cd.yml"]

# One run per ref at a time. Cancels stale runs to avoid terraform lock races.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd Backend
          pip install -r api/requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          cd Backend
          flake8 api --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 api --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Verify application starts
        run: |
          cd Backend
          timeout 10s uvicorn api.main:app --host 0.0.0.0 --port 8000 || [ $? -eq 124 ]

  deploy:
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        working-directory: Backend
        run: |
          docker build -f api/Dockerfile \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/ailixir-backend:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/ailixir-backend:${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init
        working-directory: Backend/api/terraform
        run: terraform init -reconfigure

      - name: Import existing Cloud Run service if unmanaged
        working-directory: Backend/api/terraform
        # `terraform import` requires the same variables `plan`/`apply` do —
        # otherwise it prompts interactively and the job hangs on the runner.
        # PR #200 added Neo4j vars to api/terraform/variables.tf without
        # defaults, so this command silently waited 6 hours on every run
        # before the job was killed. Pass every required variable here too.
        run: |
          terraform state show google_cloud_run_v2_service.backend > /dev/null 2>&1 \
            && echo "Already in state, skipping import." \
            || terraform import \
                -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
                -var="neo4j_uri=${{ secrets.NEO4J_URI }}" \
                -var="neo4j_user=${{ secrets.NEO4J_USER }}" \
                -var="neo4j_password=${{ secrets.NEO4J_PASSWORD }}" \
                -var="neo4j_database=${{ secrets.NEO4J_DATABASE }}" \
                google_cloud_run_v2_service.backend \
                projects/${{ secrets.GCP_PROJECT_ID }}/locations/us-east1/services/ailixir-backend

      - name: Terraform Plan
        working-directory: Backend/api/terraform
        # NEO4J_* secrets are required by api/terraform/variables.tf
        # (added in PR #200 for the /chat/query knowledge-graph retrieval).
        # Without them Terraform prompts interactively for `neo4j_password`
        # and the CI runner hangs until GitHub Actions kills the job at 6h.
        # Keep this in sync with workers/.github/workflows/worker-ci-cd.yml.
        run: |
          terraform plan -no-color \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="image_tag=${{ github.sha }}" \
            -var="neo4j_uri=${{ secrets.NEO4J_URI }}" \
            -var="neo4j_user=${{ secrets.NEO4J_USER }}" \
            -var="neo4j_password=${{ secrets.NEO4J_PASSWORD }}" \
            -var="neo4j_database=${{ secrets.NEO4J_DATABASE }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: Backend/api/terraform
        run: terraform apply -auto-approve tfplan
