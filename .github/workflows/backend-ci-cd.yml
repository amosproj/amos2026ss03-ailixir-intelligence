name: API CI/CD

on:
  push:
    branches: [main, "feature/**", "chore/issue-47-CI/CD-for-Backend"]
    paths: ["Backend/api/**", ".github/workflows/backend-ci-cd.yml"]
  pull_request:
    paths: ["Backend/api/**", ".github/workflows/backend-ci-cd.yml"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd Backend
          pip install -r api/requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          cd Backend
          flake8 api --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 api --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Verify application starts
        run: |
          cd Backend
          timeout 10s uvicorn api.main:app --host 0.0.0.0 --port 8000 || [ $? -eq 124 ]

  deploy:
    #     if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    if: success()
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        working-directory: Backend
        run: |
          docker build -f api/Dockerfile \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/ailixir-backend:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/ailixir-backend:${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init
        working-directory: Backend/api/terraform
        run: terraform init -reconfigure

      - name: Import if unmanaged
        working-directory: Backend/workers/terraform # or backend/terraform
        run: |
          terraform state show google_cloud_run_v2_service.worker > /dev/null 2>&1 \
            && echo "Already managed, skipping." \
            || terraform import \
                -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
                -var="image_tag=${{ github.sha }}" \
                google_cloud_run_v2_service.worker \
                projects/${{ secrets.GCP_PROJECT_ID }}/locations/us-east1/services/ailixir-worker

      - name: Terraform Plan
        working-directory: Backend/api/terraform
        run: |
          terraform plan -no-color \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="image_tag=${{ github.sha }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: Backend/api/terraform
        run: terraform apply -auto-approve tfplan
