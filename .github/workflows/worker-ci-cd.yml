name: Workers CI/CD

on:
  push:
    branches: [main, "feature/**", "chore/"]
    paths: ["Backend/workers/**", ".github/workflows/worker-ci-cd.yml"]
  pull_request:
    paths: ["Backend/workers/**", ".github/workflows/worker-ci-cd.yml"]
  # Manual trigger button in the Actions UI. Needed when only a GitHub Secret
  # (e.g. NEO4J_PASSWORD, DOCUMENT_AI_PROCESSOR_ID) was rotated and we want to
  # redeploy without otherwise touching any tracked file. Without this, a
  # secret rotation requires either an unrelated code change or a manual
  # `terraform apply` to take effect.
  workflow_dispatch:

# One run per ref at a time. If a new push arrives while a run is in progress
# for the same branch, cancel the older run (prevents terraform state lock races).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd Backend
          pip install -r workers/requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          cd Backend
          flake8 workers --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 workers --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Verify application starts
        run: |
          cd Backend
          # SKIP_STARTUP_CONNECTIONS prevents the lifespan from attempting real
          # Neo4j / Vertex AI connections (which aren't available in CI).
          SKIP_STARTUP_CONNECTIONS=1 timeout 10s \
            uvicorn workers.main:app --host 0.0.0.0 --port 8080 || [ $? -eq 124 ]

  deploy:
    # Only deploy on direct pushes to main (not on PRs — prevents duplicate
    # deploys and terraform lock conflicts when a PR is opened then merged).
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        working-directory: Backend
        run: |
          docker build -f workers/Dockerfile \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/ailixir-worker:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/ailixir-worker:${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init
        working-directory: Backend/workers/terraform
        run: terraform init -reconfigure

      - name: Check Terraform State
        working-directory: Backend/workers/terraform
        id: tfstate
        run: |
          if terraform state list | grep -q "google_cloud_run_v2_service.worker"; then
            echo "managed=true" >> $GITHUB_OUTPUT
          else
            echo "managed=false" >> $GITHUB_OUTPUT
          fi

      - name: Import existing Cloud Run service
        if: steps.tfstate.outputs.managed == 'false'
        working-directory: Backend/workers/terraform
        run: |
          terraform import \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            google_cloud_run_v2_service.worker \
            projects/${{ secrets.GCP_PROJECT_ID }}/locations/us-east1/services/ailixir-worker
      - name: Terraform Plan
        working-directory: Backend/workers/terraform
        run: |
          terraform plan -no-color \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="image_tag=${{ github.sha }}" \
            -var="neo4j_uri=${{ secrets.NEO4J_URI }}" \
            -var="neo4j_user=${{ secrets.NEO4J_USER }}" \
            -var="neo4j_password=${{ secrets.NEO4J_PASSWORD }}" \
            -var="neo4j_database=${{ secrets.NEO4J_DATABASE }}" \
            -var="document_ai_processor_id=${{ secrets.DOCUMENT_AI_PROCESSOR_ID }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: Backend/workers/terraform
        run: terraform apply -auto-approve tfplan
